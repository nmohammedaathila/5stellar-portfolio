<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#071428;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a36"/>
      <stop offset="50%" stop-color="#071428"/>
      <stop offset="100%" stop-color="#040b17"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f254a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a1a36" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5df88"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)"/>
  <rect width="1200" height="675" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#050e1d" fill-opacity="0.9"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Logo / Brand -->
  <circle cx="42" cy="30" r="14" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-width="1.5"/>
  <text x="42" y="35" fill="#f5df88" font-size="13" font-weight="bold" text-anchor="middle">OB</text>
  <text x="68" y="35" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="0.5">ORU BITE</text>
  <text x="148" y="35" fill="#d4af37" font-size="12" font-weight="500">| Meta Ads Manager &amp; CTR Analytics</text>

  <!-- Sample Illustrative Badge -->
  <rect x="880" y="16" width="280" height="28" rx="14" fill="#1e3a68" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="896" cy="30" r="4" fill="#d4af37"/>
  <text x="908" y="35" fill="#f5df88" font-size="11" font-weight="600" letter-spacing="0.5">ILLUSTRATIVE DASHBOARD METRIC</text>

  <!-- Header Section -->
  <g transform="translate(40, 85)">
    <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="700">Meta Ads Performance &amp; Click-Through Rate (CTR)</text>
    <text x="0" y="44" fill="#93a8c7" font-size="13">Ad campaign traffic, link clicks, cost-per-click &amp; engagement efficiency</text>
  </g>

  <!-- Metric KPI Cards -->
  <!-- Card 1: Advertising CTR -->
  <g transform="translate(40, 150)">
    <rect width="260" height="110" rx="14" fill="url(#cardGrad2)" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="20" y="32" fill="#d4af37" font-size="12" font-weight="700" letter-spacing="0.5">AVG. ADVERTISING CTR</text>
    <text x="20" y="70" fill="url(#goldGrad2)" font-size="34" font-weight="800">4.82%</text>
    <text x="20" y="94" fill="#4ade80" font-size="11" font-weight="600">+1.6% above local F&amp;B average</text>
    <circle cx="225" cy="35" r="16" fill="#d4af37" fill-opacity="0.15"/>
    <path d="M225 25l-7 14 7-3 7 3-7-14z" fill="#d4af37"/>
  </g>

  <!-- Card 2: Total Ad Clicks -->
  <g transform="translate(325, 150)">
    <rect width="260" height="110" rx="14" fill="url(#cardGrad2)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="32" fill="#93a8c7" font-size="12" font-weight="600" letter-spacing="0.5">TOTAL AD LINK CLICKS</text>
    <text x="20" y="70" fill="#ffffff" font-size="32" font-weight="800">14,320</text>
    <text x="20" y="94" fill="#4ade80" font-size="11" font-weight="600">+31.2% click growth</text>
    <circle cx="225" cy="35" r="16" fill="#38bdf8" fill-opacity="0.15"/>
    <circle cx="225" cy="35" r="7" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>

  <!-- Card 3: Cost Per Click (CPC) -->
  <g transform="translate(610, 150)">
    <rect width="260" height="110" rx="14" fill="url(#cardGrad2)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="32" fill="#93a8c7" font-size="12" font-weight="600" letter-spacing="0.5">OPTIMIZED CPC</text>
    <text x="20" y="70" fill="url(#goldGrad2)" font-size="32" font-weight="800">&#8377;1.84</text>
    <text x="20" y="94" fill="#4ade80" font-size="11" font-weight="600">Efficient hyper-local targeting</text>
    <circle cx="225" cy="35" r="16" fill="#10b981" fill-opacity="0.15"/>
    <path d="M218 35l5 5 10-10" stroke="#34d399" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Card 4: Top Performing Ad -->
  <g transform="translate(895, 150)">
    <rect width="265" height="110" rx="14" fill="url(#cardGrad2)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="32" fill="#93a8c7" font-size="12" font-weight="600" letter-spacing="0.5">TOP PERFORMING CAMPAIGN</text>
    <text x="20" y="68" fill="#f5df88" font-size="18" font-weight="700">Brownie Combo Offer</text>
    <text x="20" y="94" fill="#93a8c7" font-size="11">5.92% peak campaign CTR</text>
    <circle cx="230" cy="35" r="16" fill="#d4af37" fill-opacity="0.15"/>
    <path d="M224 28l6 6 8-8" stroke="#d4af37" stroke-width="2" fill="none"/>
  </g>

  <!-- Main Chart: CTR Trend vs Impressions -->
  <g transform="translate(40, 285)">
    <rect width="1120" height="345" rx="16" fill="url(#cardGrad2)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2"/>
    <text x="24" y="34" fill="#ffffff" font-size="15" font-weight="700">Click-Through Rate (CTR) Trendline &amp; Campaign Performance Curve</text>
    <text x="24" y="52" fill="#93a8c7" font-size="11">Daily ad set optimization for Kumarakovil-Nagercoil student &amp; food enthusiast audience</text>
    
    <!-- Legend -->
    <line x1="840" y1="35" x2="870" y2="35" stroke="#d4af37" stroke-width="3"/>
    <circle cx="855" cy="35" r="4" fill="#f5df88"/>
    <text x="880" y="39" fill="#d4af37" font-size="12" font-weight="600">CTR %</text>
    
    <line x1="960" y1="35" x2="990" y2="35" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="1000" y="39" fill="#38bdf8" font-size="12">Link Clicks</text>

    <!-- Grid lines -->
    <line x1="60" y1="95" x2="1080" y2="95" stroke="#1f3760" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="35" y="99" fill="#627d98" font-size="10">6.0%</text>
    <line x1="60" y1="145" x2="1080" y2="145" stroke="#1f3760" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="35" y="149" fill="#627d98" font-size="10">4.5%</text>
    <line x1="60" y1="195" x2="1080" y2="195" stroke="#1f3760" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="35" y="199" fill="#627d98" font-size="10">3.0%</text>
    <line x1="60" y1="245" x2="1080" y2="245" stroke="#1f3760" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="35" y="249" fill="#627d98" font-size="10">1.5%</text>
    <line x1="60" y1="285" x2="1080" y2="285" stroke="#2a4878" stroke-width="1"/>
    <text x="35" y="289" fill="#627d98" font-size="10">0.0%</text>

    <!-- Area Fill under Curve -->
    <path d="M80 230 C 180 210, 240 180, 320 160 C 400 140, 480 170, 560 130 C 640 90, 720 120, 800 100 C 880 80, 960 95, 1060 70 L 1060 285 L 80 285 Z" fill="url(#areaGrad)"/>

    <!-- CTR Line -->
    <path d="M80 230 C 180 210, 240 180, 320 160 C 400 140, 480 170, 560 130 C 640 90, 720 120, 800 100 C 880 80, 960 95, 1060 70" fill="none" stroke="#d4af37" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Data points -->
    <circle cx="80" cy="230" r="5" fill="#f5df88" stroke="#071428" stroke-width="2"/>
    <circle cx="320" cy="160" r="5" fill="#f5df88" stroke="#071428" stroke-width="2"/>
    <circle cx="560" cy="130" r="5" fill="#f5df88" stroke="#071428" stroke-width="2"/>
    <circle cx="800" cy="100" r="5" fill="#f5df88" stroke="#071428" stroke-width="2"/>
    <circle cx="1060" cy="70" r="6" fill="#f5df88" stroke="#071428" stroke-width="2"/>

    <!-- Tooltip over peak -->
    <g transform="translate(1000, 20)">
      <rect width="110" height="38" rx="8" fill="#0f254a" stroke="#d4af37" stroke-width="1"/>
      <text x="55" y="16" fill="#93a8c7" font-size="9" text-anchor="middle">PEAK CTR</text>
      <text x="55" y="31" fill="#f5df88" font-size="12" font-weight="700" text-anchor="middle">5.92%</text>
    </g>

    <!-- X Axis Labels -->
    <text x="80" y="305" fill="#93a8c7" font-size="11" text-anchor="middle">Week 1</text>
    <text x="320" y="305" fill="#93a8c7" font-size="11" text-anchor="middle">Week 2</text>
    <text x="560" y="305" fill="#93a8c7" font-size="11" text-anchor="middle">Week 3</text>
    <text x="800" y="305" fill="#93a8c7" font-size="11" text-anchor="middle">Week 4</text>
    <text x="1060" y="305" fill="#f5df88" font-size="11" font-weight="700" text-anchor="middle">Campaign Peak</text>
  </g>
</svg>
