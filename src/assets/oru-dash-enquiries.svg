<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#071428;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a36"/>
      <stop offset="50%" stop-color="#071428"/>
      <stop offset="100%" stop-color="#040b17"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f254a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a1a36" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5df88"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e3a68"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#050e1d" fill-opacity="0.9"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Logo / Brand -->
  <circle cx="42" cy="30" r="14" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-width="1.5"/>
  <text x="42" y="35" fill="#f5df88" font-size="13" font-weight="bold" text-anchor="middle">OB</text>
  <text x="68" y="35" fill="#ffffff" font-size="15" font-weight="700" letter-spacing="0.5">ORU BITE</text>
  <text x="148" y="35" fill="#d4af37" font-size="12" font-weight="500">| Customer Enquiries &amp; Orders CRM</text>

  <!-- Sample Illustrative Badge -->
  <rect x="880" y="16" width="280" height="28" rx="14" fill="#1e3a68" stroke="#d4af37" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="896" cy="30" r="4" fill="#d4af37"/>
  <text x="908" y="35" fill="#f5df88" font-size="11" font-weight="600" letter-spacing="0.5">ILLUSTRATIVE DASHBOARD METRIC</text>

  <!-- Header Section -->
  <g transform="translate(40, 85)">
    <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="700">Customer Communication &amp; Inquiries Overview</text>
    <text x="0" y="44" fill="#93a8c7" font-size="13">Direct message lead tracking, takeaway queries &amp; customer engagement rate</text>
  </g>

  <!-- Metric KPI Cards -->
  <!-- Card 1: Total Inquiries -->
  <g transform="translate(40, 150)">
    <rect width="260" height="110" rx="14" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="32" fill="#93a8c7" font-size="12" font-weight="600" letter-spacing="0.5">TOTAL INQUIRIES</text>
    <text x="20" y="70" fill="url(#goldGrad)" font-size="32" font-weight="800">1,248</text>
    <text x="20" y="94" fill="#4ade80" font-size="11" font-weight="600">+28.4% vs prev period (sample)</text>
    <circle cx="225" cy="35" r="16" fill="#d4af37" fill-opacity="0.1"/>
    <path d="M217 35h16M225 27v16" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Card 2: Response Rate -->
  <g transform="translate(325, 150)">
    <rect width="260" height="110" rx="14" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="32" fill="#93a8c7" font-size="12" font-weight="600" letter-spacing="0.5">RESPONSE RATE</text>
    <text x="20" y="70" fill="#ffffff" font-size="32" font-weight="800">98.2%</text>
    <text x="20" y="94" fill="#4ade80" font-size="11" font-weight="600">&lt; 5 min avg response speed</text>
    <circle cx="225" cy="35" r="16" fill="#3b82f6" fill-opacity="0.15"/>
    <path d="M219 35l4 4 8-8" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Card 3: Lead Conversion Rate -->
  <g transform="translate(610, 150)">
    <rect width="260" height="110" rx="14" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="32" fill="#93a8c7" font-size="12" font-weight="600" letter-spacing="0.5">WALK-IN &amp; ORDER CONVERSION</text>
    <text x="20" y="70" fill="url(#goldGrad)" font-size="32" font-weight="800">34.6%</text>
    <text x="20" y="94" fill="#93a8c7" font-size="11">Enquiry to visit conversion</text>
    <circle cx="225" cy="35" r="16" fill="#d4af37" fill-opacity="0.1"/>
    <path d="M218 39l6-6 4 4 8-8" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Card 4: Most Requested Item -->
  <g transform="translate(895, 150)">
    <rect width="265" height="110" rx="14" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3"/>
    <text x="20" y="32" fill="#93a8c7" font-size="12" font-weight="600" letter-spacing="0.5">TOP ENQUIRY PRODUCT</text>
    <text x="20" y="68" fill="#f5df88" font-size="20" font-weight="700">Walnut Brownies</text>
    <text x="20" y="94" fill="#93a8c7" font-size="11">52% of dessert combo enquiries</text>
    <circle cx="230" cy="35" r="16" fill="#ec4899" fill-opacity="0.15"/>
    <circle cx="230" cy="35" r="6" stroke="#f472b6" stroke-width="2" fill="none"/>
  </g>

  <!-- Left Chart: Weekly Enquiries Volume Trend -->
  <g transform="translate(40, 285)">
    <rect width="545" height="345" rx="16" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2"/>
    <text x="24" y="34" fill="#ffffff" font-size="15" font-weight="700">Weekly Customer Inquiries by Channel</text>
    <text x="24" y="52" fill="#93a8c7" font-size="11">Instagram DMs, WhatsApp &amp; Meta Ad Click-to-Message</text>
    
    <!-- Legend -->
    <circle cx="360" cy="30" r="5" fill="#d4af37"/>
    <text x="372" y="34" fill="#d4af37" font-size="11">Instagram DMs</text>
    <circle cx="465" cy="30" r="5" fill="#38bdf8"/>
    <text x="477" y="34" fill="#38bdf8" font-size="11">Ad Inquiries</text>

    <!-- Grid lines -->
    <line x1="45" y1="90" x2="510" y2="90" stroke="#1f3760" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="45" y1="145" x2="510" y2="145" stroke="#1f3760" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="45" y1="200" x2="510" y2="200" stroke="#1f3760" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="45" y1="255" x2="510" y2="255" stroke="#1f3760" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="45" y1="300" x2="510" y2="300" stroke="#2a4878" stroke-width="1"/>

    <!-- Bar Chart -->
    <!-- Mon -->
    <rect x="75" y="160" width="18" height="140" rx="3" fill="#d4af37" fill-opacity="0.9"/>
    <rect x="97" y="200" width="18" height="100" rx="3" fill="#38bdf8" fill-opacity="0.75"/>
    <text x="95" y="318" fill="#93a8c7" font-size="11" text-anchor="middle">Mon</text>

    <!-- Tue -->
    <rect x="140" y="140" width="18" height="160" rx="3" fill="#d4af37" fill-opacity="0.9"/>
    <rect x="162" y="180" width="18" height="120" rx="3" fill="#38bdf8" fill-opacity="0.75"/>
    <text x="160" y="318" fill="#93a8c7" font-size="11" text-anchor="middle">Tue</text>

    <!-- Wed -->
    <rect x="205" y="120" width="18" height="180" rx="3" fill="#d4af37" fill-opacity="0.9"/>
    <rect x="227" y="165" width="18" height="135" rx="3" fill="#38bdf8" fill-opacity="0.75"/>
    <text x="225" y="318" fill="#93a8c7" font-size="11" text-anchor="middle">Wed</text>

    <!-- Thu -->
    <rect x="270" y="105" width="18" height="195" rx="3" fill="#d4af37" fill-opacity="0.9"/>
    <rect x="292" y="150" width="18" height="150" rx="3" fill="#38bdf8" fill-opacity="0.75"/>
    <text x="290" y="318" fill="#93a8c7" font-size="11" text-anchor="middle">Thu</text>

    <!-- Fri -->
    <rect x="335" y="70" width="18" height="230" rx="3" fill="#d4af37" fill-opacity="0.9"/>
    <rect x="357" y="110" width="18" height="190" rx="3" fill="#38bdf8" fill-opacity="0.75"/>
    <text x="355" y="318" fill="#93a8c7" font-size="11" text-anchor="middle">Fri</text>

    <!-- Sat (Peak) -->
    <rect x="400" y="50" width="18" height="250" rx="3" fill="#f5df88"/>
    <rect x="422" y="85" width="18" height="215" rx="3" fill="#67e8f9"/>
    <text x="420" y="318" fill="#f5df88" font-size="11" font-weight="700" text-anchor="middle">Sat</text>

    <!-- Sun -->
    <rect x="465" y="60" width="18" height="240" rx="3" fill="#d4af37" fill-opacity="0.9"/>
    <rect x="487" y="95" width="18" height="205" rx="3" fill="#38bdf8" fill-opacity="0.75"/>
    <text x="485" y="318" fill="#f5df88" font-size="11" font-weight="700" text-anchor="middle">Sun</text>
  </g>

  <!-- Right Panel: Recent Customer Inquiries Stream -->
  <g transform="translate(610, 285)">
    <rect width="550" height="345" rx="16" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1" stroke-opacity="0.2"/>
    <text x="24" y="34" fill="#ffffff" font-size="15" font-weight="700">Recent Customer Inquiries Stream</text>
    <text x="24" y="52" fill="#93a8c7" font-size="11">Live customer enquiry feed (Illustrative preview)</text>

    <!-- Inquiry Item 1 -->
    <g transform="translate(24, 75)">
      <rect width="502" height="52" rx="10" fill="#081830" stroke="#d4af37" stroke-width="1" stroke-opacity="0.25"/>
      <circle cx="26" cy="26" r="14" fill="#e1306c" fill-opacity="0.2"/>
      <text x="26" y="30" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">IG</text>
      <text x="50" y="22" fill="#ffffff" font-size="12" font-weight="600">Pooja S. — Student Combo Enquiry</text>
      <text x="50" y="38" fill="#93a8c7" font-size="10">"Hi, is the iced coffee + walnut brownie student combo available today?"</text>
      <rect x="420" y="16" width="68" height="20" rx="10" fill="#16a34a" fill-opacity="0.2"/>
      <text x="454" y="30" fill="#4ade80" font-size="10" font-weight="600" text-anchor="middle">Replied (2m)</text>
    </g>

    <!-- Inquiry Item 2 -->
    <g transform="translate(24, 138)">
      <rect width="502" height="52" rx="10" fill="#081830" stroke="#d4af37" stroke-width="1" stroke-opacity="0.15"/>
      <circle cx="26" cy="26" r="14" fill="#25d366" fill-opacity="0.2"/>
      <text x="26" y="30" fill="#22c55e" font-size="10" font-weight="bold" text-anchor="middle">WA</text>
      <text x="50" y="22" fill="#ffffff" font-size="12" font-weight="600">Arun Kumar — Custom Pastry Box Order</text>
      <text x="50" y="38" fill="#93a8c7" font-size="10">"Need 6 boxes of walnut brownies for college farewell party tomorrow"</text>
      <rect x="420" y="16" width="68" height="20" rx="10" fill="#d4af37" fill-opacity="0.2"/>
      <text x="454" y="30" fill="#f5df88" font-size="10" font-weight="600" text-anchor="middle">Confirmed</text>
    </g>

    <!-- Inquiry Item 3 -->
    <g transform="translate(24, 201)">
      <rect width="502" height="52" rx="10" fill="#081830" stroke="#d4af37" stroke-width="1" stroke-opacity="0.15"/>
      <circle cx="26" cy="26" r="14" fill="#1877f2" fill-opacity="0.2"/>
      <text x="26" y="30" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">FB</text>
      <text x="50" y="22" fill="#ffffff" font-size="12" font-weight="600">Meera R. — Location &amp; Timing Query</text>
      <text x="50" y="38" fill="#93a8c7" font-size="10">"Are you open till 10 PM along Kumarakovil road? Planning a dine-in visit"</text>
      <rect x="420" y="16" width="68" height="20" rx="10" fill="#16a34a" fill-opacity="0.2"/>
      <text x="454" y="30" fill="#4ade80" font-size="10" font-weight="600" text-anchor="middle">Replied (4m)</text>
    </g>

    <!-- Inquiry Item 4 -->
    <g transform="translate(24, 264)">
      <rect width="502" height="52" rx="10" fill="#081830" stroke="#d4af37" stroke-width="1" stroke-opacity="0.15"/>
      <circle cx="26" cy="26" r="14" fill="#e1306c" fill-opacity="0.2"/>
      <text x="26" y="30" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">IG</text>
      <text x="50" y="22" fill="#ffffff" font-size="12" font-weight="600">Vignesh T. — Fresh Batch Availability</text>
      <text x="50" y="38" fill="#93a8c7" font-size="10">"Can I reserve 2 hot chocolate brownies for evening pickup at 6 PM?"</text>
      <rect x="420" y="16" width="68" height="20" rx="10" fill="#d4af37" fill-opacity="0.2"/>
      <text x="454" y="30" fill="#f5df88" font-size="10" font-weight="600" text-anchor="middle">Reserved</text>
    </g>
  </g>
</svg>
